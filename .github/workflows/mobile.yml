name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --max-workers=2 :composeApp:testDebugUnitTest --stacktrace
      - run: ./gradlew --max-workers=2 :composeApp:assembleDebug --stacktrace
      - name: Check Stereo Love score and packaging
        run: |
          python3 tools/stereo_love/score.py --check
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          apk, = Path("composeApp/build/outputs/apk/debug").glob("*.apk")
          track = Path("arranger/build/generated/assets/backing/stereo-love.m4a")
          with ZipFile(apk) as package:
              for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
                  with package.open(f"lib/{abi}/libpinch_stage.so") as renderer:
                      assert renderer.read(4) == b"\x7fELF", f"Missing game renderer for {abi}"
              asset = package.getinfo("assets/backing/stereo-love.m4a")
              assert asset.compress_type == ZIP_STORED, "MediaPlayer needs an uncompressed asset"
              assert package.read(asset) == track.read_bytes(), "Packaged soundtrack differs from build master"
              arrangements = Path("arranger/build/generated/assets")
              tracks = sorted(arrangements.glob("arrangements/*/*"))
              assert len(tracks) == 32 and len({track.parent for track in tracks}) == 8
              for track in tracks:
                  item = package.getinfo("assets/" + track.relative_to(arrangements).as_posix())
                  assert item.compress_type == ZIP_STORED and package.read(item) == track.read_bytes(), item.filename
              for instrument in ("piano", "mallet", "synth"):
                  strike = package.getinfo(f"assets/feedback/{instrument}.wav")
                  assert strike.compress_type == ZIP_STORED and strike.file_size > 44
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: pinch-music-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: xcodebuild -version
      - run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath "$RUNNER_TEMP/PinchBuild" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/PinchBuild/Build/Products/Debug-iphonesimulator/PinchMusic.app"
          cmp arranger/build/generated/assets/backing/stereo-love.m4a "$app/media/backing/stereo-love.m4a"
          test "$(find "$app/arrangements" -type f | wc -l | tr -d ' ')" = 32
          diff -qr arranger/build/generated/assets/arrangements "$app/arrangements"
          for instrument in piano mallet synth; do
            test -s "$app/media/instruments/$instrument/60.wav"
            test -s "$app/media/feedback/$instrument.wav"
          done
